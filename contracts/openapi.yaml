    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [projectName]
      properties:
        projectName: { type: string, minLength: 1, maxLength: 120 }
        cloneFromProjectId: { type: string, minLength: 1, maxLength: 128 }
    AttachmentPresignRequest:
      type: object
      additionalProperties: false
      required: [fileName, mimeType, size, sha256]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { type: string, minLength: 1, maxLength: 160 }
        size: { type: integer, minimum: 1, maximum: 52428800 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    AttachmentPresignView:
      type: object
      additionalProperties: false
      required: [uploadUrl, storageKey, expiresAt]
      properties:
        uploadUrl: { type: string, format: uri }
        storageKey: { type: string }
        expiresAt: { type: string, format: date-time }
        headers: { type: object, additionalProperties: { type: string } }
    AttachmentDownloadView:
      type: object
      additionalProperties: false
      required: [downloadUrl, expiresAt]
      properties:
        downloadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    PublicRsvpRequest:
      type: object
      additionalProperties: false
      required: [attending, companions, dietary, note]
      properties:
        attending: { type: boolean }
        companions: { type: integer, minimum: 0, maximum: 9 }
        dietary: { type: string, maxLength: 500 }
        note: { type: string, maxLength: 1000 }
    PublicInvitationView:
      type: object
      required: [profile, guest, invitation]
      properties:
        profile: { $ref: '#/components/schemas/WeddingProfile' }
        guest: { type: object }
        invitation: { type: object }
    ProjectSummary:
      type: object
      required: [projectId, projectName, weddingDate, status, archived, lastOpenedAt, revision]
      properties:
        projectId: { type: string }
        projectName: { type: string }
        groomName: { type: string }
        brideName: { type: string }
        weddingDate: { type: string }
        status: { type: string }
        archived: { type: boolean }
        lastOpenedAt: { type: string, format: date-time }
        revision: { type: integer, minimum: 1 }
    ConflictDetail:
      type: object
      additionalProperties: false
      required: [remoteRevision, fields, message]
      properties:
        remoteRevision: { type: integer, minimum: 1 }
        fields: { type: array, items: { type: string } }
        message: { type: string }
        latestSnapshot: { $ref: '#/components/schemas/WeddingDatabase' }
    ErrorEnvelope:
      type: object
      required: [success, code, message]
      properties:
        success: { const: false }
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        errors: { type: array, items: { type: string } }
        data: { $ref: '#/components/schemas/ConflictDetail' }


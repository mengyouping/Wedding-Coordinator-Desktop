openapi: 3.1.0
info:
  title: Wedding OS 婚礼总指挥 API
  version: 4.1.0
  description: >-
    Wedding OS Schema v4 生产接口契约。管理端使用项目级强类型领域接口、If-Match revision
    与 Idempotency-Key；公开请帖使用不可预测 Token 匿名访问。ADABAS 正式联调由接入方完成。
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Projects
  - name: Collaboration
  - name: Finance
  - name: Execution
  - name: Governance
  - name: Attachments
  - name: PublicInvitation

paths:
  /wedding/projects:
    get:
      tags: [Projects]
      operationId: listWeddingProjects
      summary: 查询当前用户可访问的婚礼项目
      responses:
        '200': { $ref: '#/components/responses/ProjectListResponse' }
    post:
      tags: [Projects]
      operationId: createWeddingProject
      summary: 创建或复制婚礼项目
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateProjectRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /wedding/projects/{projectId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    delete:
      tags: [Projects]
      operationId: deleteWeddingProject
      summary: 删除婚礼项目
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/EmptyResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /wedding/projects/{projectId}/snapshot:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [Projects]
      operationId: getWeddingSnapshot
      summary: 获取 Schema v4 完整项目快照
      responses:
        '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Projects]
      operationId: replaceWeddingSnapshot
      summary: 导入或整体替换项目快照
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WeddingDatabase' } } }
      responses:
        '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /wedding/projects/{projectId}/reset:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [Projects]
      operationId: resetWeddingProject
      summary: 重置婚礼项目
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }

  /wedding/projects/{projectId}/settings:
    $ref: '#/components/pathItems/SettingsCollection'
  /wedding/projects/{projectId}/profile:
    $ref: '#/components/pathItems/ProfileCollection'
  /wedding/projects/{projectId}/budget:
    $ref: '#/components/pathItems/BudgetCollection'
  /wedding/projects/{projectId}/tasks:
    $ref: '#/components/pathItems/TasksCollection'
  /wedding/projects/{projectId}/guests:
    $ref: '#/components/pathItems/GuestsCollection'
  /wedding/projects/{projectId}/tables:
    $ref: '#/components/pathItems/TablesCollection'
  /wedding/projects/{projectId}/seat-assignments:
    $ref: '#/components/pathItems/SeatAssignmentsCollection'
  /wedding/projects/{projectId}/seating-plans:
    $ref: '#/components/pathItems/SeatingPlansCollection'
  /wedding/projects/{projectId}/vendors:
    $ref: '#/components/pathItems/VendorsCollection'
  /wedding/projects/{projectId}/timeline:
    $ref: '#/components/pathItems/TimelineCollection'
  /wedding/projects/{projectId}/invitations:
    $ref: '#/components/pathItems/InvitationsCollection'
  /wedding/projects/{projectId}/risks:
    $ref: '#/components/pathItems/RisksCollection'
  /wedding/projects/{projectId}/materials:
    $ref: '#/components/pathItems/MaterialsCollection'
  /wedding/projects/{projectId}/members:
    $ref: '#/components/pathItems/MembersCollection'
  /wedding/projects/{projectId}/quotes:
    $ref: '#/components/pathItems/QuotesCollection'
  /wedding/projects/{projectId}/contracts:
    $ref: '#/components/pathItems/ContractsCollection'
  /wedding/projects/{projectId}/transactions:
    $ref: '#/components/pathItems/TransactionsCollection'
  /wedding/projects/{projectId}/runbook-events:
    $ref: '#/components/pathItems/RunbookEventsCollection'
  /wedding/projects/{projectId}/check-ins:
    $ref: '#/components/pathItems/CheckInsCollection'
  /wedding/projects/{projectId}/incidents:
    $ref: '#/components/pathItems/IncidentsCollection'

  /wedding/projects/{projectId}/audit-logs:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [Governance]
      operationId: listWeddingAuditLogs
      summary: 查询只读审计日志
      responses:
        '200': { $ref: '#/components/responses/AuditLogsResponse' }

  /wedding/projects/{projectId}/attachments:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [Attachments]
      operationId: listWeddingAttachments
      summary: 查询附件元数据
      responses:
        '200': { $ref: '#/components/responses/AttachmentsResponse' }
    put:
      tags: [Attachments]
      operationId: replaceWeddingAttachments
      summary: 保存附件元数据
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentArray' } } }
      responses:
        '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /wedding/projects/{projectId}/attachments/presign:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [Attachments]
      operationId: createAttachmentPresignedUpload
      summary: 创建附件预签名上传地址
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentPresignRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AttachmentPresignResponse' }

  /wedding/projects/{projectId}/attachments/{attachmentId}/download:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Attachments]
      operationId: getAttachmentDownloadAddress
      summary: 获取受权限控制的附件下载地址
      responses:
        '200': { $ref: '#/components/responses/AttachmentDownloadResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/invitations/{token}:
    parameters: [{ $ref: '#/components/parameters/InvitationToken' }]
    get:
      security: []
      tags: [PublicInvitation]
      operationId: getPublicInvitation
      summary: 获取专属公开请帖
      responses:
        '200': { $ref: '#/components/responses/PublicInvitationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  /public/invitations/{token}/opened:
    parameters: [{ $ref: '#/components/parameters/InvitationToken' }]
    post:
      security: []
      tags: [PublicInvitation]
      operationId: markPublicInvitationOpened
      summary: 记录请帖打开事件
      responses:
        '200': { $ref: '#/components/responses/PublicInvitationResponse' }

  /public/invitations/{token}/rsvp:
    parameters: [{ $ref: '#/components/parameters/InvitationToken' }]
    post:
      security: []
      tags: [PublicInvitation]
      operationId: submitPublicInvitationRsvp
      summary: 新增或修改赴约回执
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicRsvpRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/PublicInvitationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 由统一身份系统签发的访问令牌；ADABAS 正式联调由接入方完成。

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 8, maxLength: 256 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前项目 revision；不一致返回 409 ConflictDetail。
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }

  pathItems:
    SettingsCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Projects], operationId: getProjectSettings, summary: 获取项目设置, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' } } }
      put: { tags: [Projects], operationId: replaceProjectSettings, summary: 更新项目设置, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectSettings' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    ProfileCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Projects], operationId: getWeddingProfile, summary: 获取婚礼资料, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' } } }
      put: { tags: [Projects], operationId: replaceWeddingProfile, summary: 更新婚礼资料, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WeddingProfile' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    BudgetCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Finance], operationId: getWeddingBudget, summary: 获取预算, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' } } }
      put: { tags: [Finance], operationId: replaceWeddingBudget, summary: 更新预算, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetData' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    TasksCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Collaboration], operationId: listWeddingTasks, summary: 查询任务, responses: { '200': { $ref: '#/components/responses/TasksResponse' } } }
      put: { tags: [Collaboration], operationId: replaceWeddingTasks, summary: 批量替换任务, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    GuestsCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Collaboration], operationId: listWeddingGuests, summary: 查询宾客, responses: { '200': { $ref: '#/components/responses/GuestsResponse' } } }
      put: { tags: [Collaboration], operationId: replaceWeddingGuests, summary: 批量替换宾客, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GuestArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    TablesCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Collaboration], operationId: listWeddingTables, summary: 查询桌位, responses: { '200': { $ref: '#/components/responses/TablesResponse' } } }
      put: { tags: [Collaboration], operationId: replaceWeddingTables, summary: 批量替换桌位, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TableArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    SeatAssignmentsCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Collaboration], operationId: listWeddingSeatAssignments, summary: 查询排桌关系, responses: { '200': { $ref: '#/components/responses/SeatAssignmentsResponse' } } }
      put: { tags: [Collaboration], operationId: replaceWeddingSeatAssignments, summary: 批量替换排桌关系, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SeatAssignmentArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    SeatingPlansCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Collaboration], operationId: listWeddingSeatingPlans, summary: 查询排桌方案, responses: { '200': { $ref: '#/components/responses/SeatingPlansResponse' } } }
      put: { tags: [Collaboration], operationId: replaceWeddingSeatingPlans, summary: 批量替换排桌方案, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SeatingPlanArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    VendorsCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Finance], operationId: listWeddingVendors, summary: 查询供应商, responses: { '200': { $ref: '#/components/responses/VendorsResponse' } } }
      put: { tags: [Finance], operationId: replaceWeddingVendors, summary: 批量替换供应商, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VendorArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    TimelineCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Execution], operationId: listWeddingTimelineItems, summary: 查询婚礼日流程, responses: { '200': { $ref: '#/components/responses/TimelineResponse' } } }
      put: { tags: [Execution], operationId: replaceWeddingTimelineItems, summary: 批量替换婚礼日流程, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TimelineArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    InvitationsCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Execution], operationId: listWeddingInvitations, summary: 查询电子请帖, responses: { '200': { $ref: '#/components/responses/InvitationsResponse' } } }
      put: { tags: [Execution], operationId: replaceWeddingInvitations, summary: 批量替换电子请帖, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    RisksCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Governance], operationId: listWeddingRisks, summary: 查询风险, responses: { '200': { $ref: '#/components/responses/RisksResponse' } } }
      put: { tags: [Governance], operationId: replaceWeddingRisks, summary: 批量替换风险, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RiskArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    MaterialsCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Execution], operationId: listWeddingMaterials, summary: 查询物料, responses: { '200': { $ref: '#/components/responses/MaterialsResponse' } } }
      put: { tags: [Execution], operationId: replaceWeddingMaterials, summary: 批量替换物料, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaterialArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    MembersCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Collaboration], operationId: listWeddingMembers, summary: 查询项目成员, responses: { '200': { $ref: '#/components/responses/MembersResponse' } } }
      put: { tags: [Collaboration], operationId: replaceWeddingMembers, summary: 批量替换项目成员, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MemberArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    QuotesCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Finance], operationId: listWeddingQuotes, summary: 查询报价, responses: { '200': { $ref: '#/components/responses/QuotesResponse' } } }
      put: { tags: [Finance], operationId: replaceWeddingQuotes, summary: 批量替换报价, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    ContractsCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Finance], operationId: listWeddingContracts, summary: 查询合同, responses: { '200': { $ref: '#/components/responses/ContractsResponse' } } }
      put: { tags: [Finance], operationId: replaceWeddingContracts, summary: 批量替换合同, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContractArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    TransactionsCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Finance], operationId: listWeddingTransactions, summary: 查询财务流水, responses: { '200': { $ref: '#/components/responses/TransactionsResponse' } } }
      put: { tags: [Finance], operationId: replaceWeddingTransactions, summary: 批量替换财务流水, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    RunbookEventsCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Execution], operationId: listWeddingRunbookEvents, summary: 查询作战事件, responses: { '200': { $ref: '#/components/responses/RunbookEventsResponse' } } }
      put: { tags: [Execution], operationId: replaceWeddingRunbookEvents, summary: 批量替换作战事件, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RunbookEventArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    CheckInsCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Execution], operationId: listWeddingCheckIns, summary: 查询签到记录, responses: { '200': { $ref: '#/components/responses/CheckInsResponse' } } }
      put: { tags: [Execution], operationId: replaceWeddingCheckIns, summary: 批量替换签到记录, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckInArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
    IncidentsCollection:
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      get: { tags: [Execution], operationId: listWeddingIncidents, summary: 查询现场异常, responses: { '200': { $ref: '#/components/responses/IncidentsResponse' } } }
      put: { tags: [Execution], operationId: replaceWeddingIncidents, summary: 批量替换现场异常, parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentArray' } } } }, responses: { '200': { $ref: '#/components/responses/WeddingDatabaseResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }

  schemas:
    WeddingDatabase: { $ref: './wedding-data.schema.json' }
    ProjectSettings: { $ref: './wedding-data.schema.json#/$defs/projectSettings' }
    WeddingProfile: { $ref: './wedding-data.schema.json#/$defs/profile' }
    BudgetData: { $ref: './wedding-data.schema.json#/$defs/budget' }
    WeddingTask: { $ref: './wedding-data.schema.json#/$defs/task' }
    Guest: { $ref: './wedding-data.schema.json#/$defs/guest' }
    WeddingTable: { $ref: './wedding-data.schema.json#/$defs/table' }
    SeatAssignment: { $ref: './wedding-data.schema.json#/$defs/seatAssignment' }
    SeatingPlan: { $ref: './wedding-data.schema.json#/$defs/seatingPlan' }
    Vendor: { $ref: './wedding-data.schema.json#/$defs/vendor' }
